name: CD - Build and Push Docker Images

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/observatory-api:latest
            ${{ env.DOCKER_USERNAME }}/observatory-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/observatory-ui:latest
            ${{ env.DOCKER_USERNAME }}/observatory-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max