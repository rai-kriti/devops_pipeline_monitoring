name: CD - Build and Push Docker Images

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_USERNAME: kritiwork825

permissions:
  actions: read
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for CI to pass for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

            for (let attempt = 1; attempt <= 40; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "ci.yml",
                head_sha: sha,
                per_page: 100,
              });
              const run = data.workflow_runs.find(candidate =>
                candidate.head_sha === sha &&
                candidate.event === "push" &&
                candidate.head_branch === "main"
              );

              if (run?.status === "completed") {
                if (run.conclusion !== "success") {
                  core.setFailed(`CI for ${sha} concluded ${run.conclusion}.`);
                  return;
                }
                core.info(`CI passed for ${sha}.`);
                return;
              }

              core.info(`Waiting for CI for ${sha} (attempt ${attempt}/40).`);
              await delay(30_000);
            }

            core.setFailed(`Timed out waiting for CI to finish for ${sha}.`);

  build-and-push:
    needs: gate-ci
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check AWS deployment configuration
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$TF_STATE_BUCKET"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Read application endpoint from Terraform state
        id: infrastructure
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
        run: |
          terraform -chdir=infra/terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=devops-observatory/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          APP_INSTANCE_ID="$(terraform -chdir=infra/terraform output -raw app_instance_id)"
          APP_PUBLIC_IP="$(aws ec2 describe-instances \
            --instance-ids "$APP_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)"
          if [[ -z "$APP_PUBLIC_IP" || "$APP_PUBLIC_IP" == "None" ]]; then
            echo "::error::The application EC2 instance has no public IPv4 address."
            exit 1
          fi
          echo "api_url=http://${APP_PUBLIC_IP}:5000" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/observatory-api:latest
            ${{ env.DOCKER_USERNAME }}/observatory-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ steps.infrastructure.outputs.api_url }}
          tags: |
            kritiwork825/observatory-ui:latest
            kritiwork825/observatory-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max